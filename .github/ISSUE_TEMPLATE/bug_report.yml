name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong, in plain words.
      placeholder: My public page shows a 404 even though my profile is published.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so someone else can see the same bug.
      placeholder: |
        1. Register at /setup
        2. Add a link in the dashboard
        3. Open /myname
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / OS
      description: Commit SHA (git rev-parse --short HEAD) and your OS / browser.
      placeholder: a1b2c3d, Windows 11 / Firefox
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server output or browser console errors.
      render: shell
    validations:
      required: false
